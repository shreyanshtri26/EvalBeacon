# Prometheus scrape + alerting config for the docker-compose stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerting_rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Metrics the OpenTelemetry Collector re-exports (OTLP metrics from apps, host metrics)
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # The demo app's own Prometheus endpoint
  - job_name: llm-app
    metrics_path: /metrics/
    static_configs:
      - targets: ["llm-app:8000"]
